<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a78"/>
      <stop offset="1" stop-color="#16123a"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="38" cy="36" r="12.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- The phone. -->
  <rect x="13" y="8" width="24" height="42" rx="5" fill="#f2efff"/>
  <rect x="16" y="13" width="18" height="30" rx="2" fill="#16123a"/>
  <circle cx="25" cy="46.5" r="1.6" fill="#16123a"/>
  <!-- Under the lens, what its apps do: lines running out to dots. -->
  <g clip-path="url(#lens)">
    <rect x="22" y="20" width="32" height="32" fill="#1f1850"/>
    <g fill="none" stroke="#FFD60A" stroke-width="2.2" stroke-linecap="round">
      <path d="M26 31 C 33 31, 35 27, 42 27"/>
      <path d="M26 36 L 44 36"/>
      <path d="M26 41 C 33 41, 35 45, 42 45"/>
    </g>
    <circle cx="44" cy="27" r="2.6" fill="#FFD60A"/>
    <circle cx="46" cy="36" r="2.6" fill="#FFD60A"/>
    <circle cx="44" cy="45" r="2.6" fill="#FFD60A"/>
  </g>
  <!-- The magnifying glass. -->
  <circle cx="38" cy="36" r="12.5" fill="none" stroke="#FFD60A" stroke-width="4"/>
  <path d="M47.5 45.5 L55 53" stroke="#FFD60A" stroke-width="6" stroke-linecap="round"/>
</svg>
